name: poll-sec

# SEC Form 4 cluster poller. Runs every 10 minutes so a new cluster reaches
# Telegram within ~10 min of the filing appearing on EDGAR. (GitHub cron is
# best-effort and can lag a few minutes under load — that is expected.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}          # allow manual "Run workflow" from the Actions tab

# Never let two SEC runs overlap; idempotency makes a queued run safe.
concurrency:
  group: poll-sec
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8           # free-tier discipline: a run should take <2 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Poll SEC EDGAR
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEC_APP_NAME: ${{ secrets.SEC_APP_NAME }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          TELEGRAM_SEC_PAID_CHANNEL: ${{ secrets.TELEGRAM_SEC_PAID_CHANNEL }}
          TELEGRAM_SEC_FREE_CHANNEL: ${{ secrets.TELEGRAM_SEC_FREE_CHANNEL }}
          TELEGRAM_FDA_PAID_CHANNEL: ${{ secrets.TELEGRAM_FDA_PAID_CHANNEL }}
          TELEGRAM_FDA_FREE_CHANNEL: ${{ secrets.TELEGRAM_FDA_FREE_CHANNEL }}
        run: python -m src.jobs.poll_sec
